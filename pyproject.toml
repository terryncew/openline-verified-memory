[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-verified-memory"
version = "0.2.0"
description = "Evidence-derived inheritance for AI agent memory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Terrynce White"}]

[tool.setuptools.packages.find]
where = ["src"]
